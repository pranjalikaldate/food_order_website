<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Forgot Password</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body{background:#2f3542;}
        .auth-box{width:380px;margin:8% auto;background:white;padding:30px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.3);text-align:center;}
        .auth-box h2{margin-bottom:20px;color:#2f3542;}
        .auth-box input{width:100%;padding:12px 10px;margin-bottom:15px;border:1px solid #ccc;border-radius:5px;font-size:14px;}
        .auth-message{font-weight:bold;margin-bottom:10px;display:none;font-size:14px;}
        .reset-link-box{background:#fff3cd;color:#856404;padding:12px;border-radius:5px;font-size:13px;word-break:break-all;display:none;margin-top:15px;}
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Admin Password Reset</h2>
        <p id="auth-message" class="auth-message"></p>
        <form id="admin-forgot-form">
            <input type="text" id="username" placeholder="Admin Username" required>
            <input type="submit" value="Send Reset Link" class="btn btn-primary" style="width:100%;">
        </form>
        <div class="reset-link-box" id="reset-link-box"></div>
    </div>

    <script src="js/admin-forgot-password.js"></script>
</body>
</html>
