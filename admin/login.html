<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body{background:#2f3542;}
        .auth-box{width:350px;margin:8% auto;background:white;padding:30px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.3);text-align:center;}
        .auth-box h2{margin-bottom:5px;color:#2f3542;}
        .auth-box p.sub{color:#888;font-size:13px;margin-bottom:20px;}
        .auth-box input{width:100%;padding:12px 10px;margin-bottom:15px;border:1px solid #ccc;border-radius:5px;font-size:14px;}
        .auth-message{font-weight:bold;margin-bottom:10px;display:none;}
        .default-hint{font-size:12px;color:#aaa;margin-top:15px;}
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Admin Login</h2>
        <p class="sub">Restaurant Management</p>
        <p id="auth-message" class="auth-message"></p>
        <form id="admin-login-form">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="submit" value="Login" class="btn btn-primary" style="width:100%;">
        </form>
        <p class="default-hint">First time? Default login is username <strong>admin</strong>, password <strong>admin123</strong></p>
        <p><a href="forgot-password.html">Forgot Password?</a></p>
    </div>

    <script src="js/admin-login.js"></script>
</body>
</html>
