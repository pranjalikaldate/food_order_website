<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body{background:#f4f4f4;}
        .admin-bar{background:#2f3542;padding:15px 5%;color:white;display:flex;justify-content:space-between;align-items:center;}
        .admin-bar a{color:#ff6b81;text-decoration:none;margin-left:15px;}
        .dash-container{width:75%;margin:30px auto;}
        .add-box{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 5px 15px rgba(0,0,0,0.08);}
        .add-box input{padding:10px;margin-right:10px;border:1px solid #ccc;border-radius:5px;}
        table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;}
        th, td{border:1px solid #eee;padding:10px;text-align:left;vertical-align:middle;}
        th{background:#ff6b81;color:white;}
        tr:nth-child(even){background:#fafafa;}
        td img{width:50px;height:50px;object-fit:cover;border-radius:5px;}
        .row-actions button{margin-right:8px;padding:5px 10px;border:none;border-radius:5px;cursor:pointer;}
        .btn-edit{background:#70a1ff;color:white;}
        .btn-delete{background:#ff4757;color:white;}
        .form-message{font-weight:bold;margin-bottom:10px;display:none;}

        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:100;}
        .modal-box{background:white;padding:25px;border-radius:10px;width:380px;}
        .modal-box h3{margin-bottom:15px;color:#2f3542;}
        .modal-box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:5px;}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
        .modal-actions button{padding:8px 15px;border:none;border-radius:5px;cursor:pointer;}
        .btn-cancel{background:#ccc;}
        .btn-save{background:#2ed573;color:white;}
    </style>
</head>
<body>
    <div class="admin-bar">
        <div>Admin Panel — <span id="admin-name"></span></div>
        <div><a href="dashboard.html">Dashboard</a><a href="#" id="logout-link">Logout</a></div>
    </div>

    <div class="dash-container">
        <h2 style="margin-bottom:20px;color:#2f3542;">Manage Categories</h2>

        <div class="add-box">
            <p id="form-message" class="form-message"></p>
            <form id="add-category-form" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Category name" required>
                <input type="file" name="image" accept="image/*" required>
                <input type="submit" value="Add Category" class="btn btn-primary">
            </form>
        </div>

        <table>
            <thead><tr><th>Image</th><th>Name</th><th>Actions</th></tr></thead>
            <tbody id="categories-body"></tbody>
        </table>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <h3>Edit Category</h3>
            <form id="edit-category-form" enctype="multipart/form-data">
                <input type="hidden" name="id" id="edit-id">
                <input type="text" name="name" id="edit-name" required>
                <label style="font-size:13px;color:#888;">Leave blank to keep current image</label>
                <input type="file" name="image" accept="image/*">
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancel-edit">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin-guard.js"></script>
    <script src="js/admin-manage-categories.js"></script>
</body>
</html>
