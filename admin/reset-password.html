<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reset Password</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body{background:#2f3542;}
        .auth-box{width:380px;margin:8% auto;background:white;padding:30px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.3);text-align:center;}
        .auth-box h2{margin-bottom:20px;color:#2f3542;}
        .auth-box input{width:100%;padding:12px 10px;margin-bottom:15px;border:1px solid #ccc;border-radius:5px;font-size:14px;}
        .auth-message{font-weight:bold;margin-bottom:10px;display:none;font-size:14px;}
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Reset Admin Password</h2>
        <p id="auth-message" class="auth-message"></p>
        <form id="admin-reset-form">
            <input type="password" id="password" placeholder="New Password (min 6 chars)" required minlength="6">
            <input type="submit" value="Reset Password" class="btn btn-primary" style="width:100%;">
        </form>
    </div>

    <script src="js/admin-reset-password.js"></script>
</body>
</html>
