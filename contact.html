<!DOCTYPE html>
<html lang="en">
<head>
    <title>Attractive Contact Page</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        .container {
            width: 350px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 10px;
            border: none;
            border-bottom: 2px solid #ccc;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-bottom: 2px solid #2575fc;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #999;
            font-size: 14px;
            pointer-events: none;
            transition: 0.3s;
        }

        .input-box input:focus + label,
        .input-box input:valid + label {
            top: -5px;
            font-size: 12px;
            color: #2575fc;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        .footer-text {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Contact Us</h2>

    <p id="contact-message" style="font-weight:bold; margin-bottom:15px; display:none;"></p>

    <form id="contact-form">
        <div class="input-box">
            <input type="text" name="full_name" required>
            <label>Full Name</label>
        </div>

        <div class="input-box">
            <input type="email" name="email" required>
            <label>Email Address</label>
        </div>

        <div class="input-box">
            <input type="tel" name="phone" required>
            <label>Mobile Number</label>
        </div>

        <button type="submit">Submit</button>
    </form>

    <div class="footer-text">We will get back to you soon 😊</div>
</div>

<script src="js/contact.js"></script>

</body>
</html>
