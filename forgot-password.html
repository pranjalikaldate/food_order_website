<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-box{width:380px;margin:5% auto;background:white;padding:30px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.15);text-align:center;}
        .auth-box h2{margin-bottom:10px;color:#2f3542;}
        .auth-box p.sub{color:#888;font-size:13px;margin-bottom:20px;}
        .auth-box input{width:100%;padding:12px 10px;margin-bottom:15px;border:1px solid #ccc;border-radius:5px;font-size:14px;}
        .auth-message{font-weight:bold;margin-bottom:10px;display:none;font-size:14px;}
        .reset-link-box{background:#fff3cd;color:#856404;padding:12px;border-radius:5px;font-size:13px;word-break:break-all;display:none;margin-top:15px;}
    </style>
</head>
<body>
    <section class="navbar">
        <div class="container">
            <div class="logo"><a href="index.html"><img src="images/logo.jpg" alt="Restaurant Logo" class="image-responsive"></a></div>
            <div class="menu text-right">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </div>
            <div class="clearfix"></div>
        </div>
    </section>

    <div class="auth-box">
        <h2>Forgot Password</h2>
        <p class="sub">Enter your account email to get a reset link</p>
        <p id="auth-message" class="auth-message"></p>
        <form id="forgot-form">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="submit" value="Send Reset Link" class="btn btn-primary" style="width:100%;">
        </form>
        <div class="reset-link-box" id="reset-link-box"></div>
    </div>

    <script src="js/forgot-password.js"></script>
</body>
</html>
