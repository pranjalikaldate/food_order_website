<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-box{width:380px;margin:5% auto;background:white;padding:30px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.15);text-align:center;}
        .auth-box h2{margin-bottom:20px;color:#2f3542;}
        .auth-box input{width:100%;padding:12px 10px;margin-bottom:15px;border:1px solid #ccc;border-radius:5px;font-size:14px;}
        .auth-message{font-weight:bold;margin-bottom:10px;display:none;font-size:14px;}
    </style>
</head>
<body>
    <section class="navbar">
        <div class="container">
            <div class="logo"><a href="index.html"><img src="images/logo.jpg" alt="Restaurant Logo" class="image-responsive"></a></div>
            <div class="menu text-right"><ul><li><a href="index.html">Home</a></li></ul></div>
            <div class="clearfix"></div>
        </div>
    </section>

    <div class="auth-box">
        <h2>Reset Password</h2>
        <p id="auth-message" class="auth-message"></p>
        <form id="reset-form">
            <input type="password" id="password" placeholder="New Password (min 6 chars)" required minlength="6">
            <input type="submit" value="Reset Password" class="btn btn-primary" style="width:100%;">
        </form>
    </div>

    <script src="js/reset-password.js"></script>
</body>
</html>
